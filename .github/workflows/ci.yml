name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
      AUTH_SECRET: ci-dev-secret-not-for-production
      AUTH_DEFAULT_PASSWORD: admin12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Sync database schema
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
